<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-label="DSH 手机端 —— 把本机 DeepSeek Harness 接入手机">
  <title>DSH 手机端</title>
  <desc>用手机通过局域网或 frp 隧道访问本机 DeepSeek Harness WebUI 的开源客户端。竖版宣传图，底部二维码指向 GitHub 仓库。</desc>
